name: Deploy to Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy to Server via SCP
        uses: appleboy/scp-action@master
        with:
          host: 104.248.148.247
          username: root
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: "dist/*"
          target: "/opt/1panel/apps/openresty/openresty/www/sites/agotado.xyz/index"
          strip_components: 1
          rm: true